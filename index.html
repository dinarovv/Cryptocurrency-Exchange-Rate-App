<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Tracker</title>

  <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  CRYPTO TRACKER — Структура проекта                         ║
    ╠══════════════════════════════════════════════════════════════╣
    ║  index.html  — этот файл: разметка + React-компоненты       ║
    ║  styles.css  — все стили (подключён ниже через <link>)       ║
    ║  js/config.js — константы и API-запросы                     ║
    ║  js/utils.js  — форматирование чисел и дат                  ║
    ╠══════════════════════════════════════════════════════════════╣
    ║  Как открыть: двойной клик → Chrome / Edge                  ║
    ║  Установка пакетов не нужна — всё через CDN                 ║
    ╚══════════════════════════════════════════════════════════════╝
  -->

  <!-- Все стили приложения -->
  <link rel="stylesheet" href="styles.css" />

  <!-- React 18 и ReactDOM — UI-библиотека и рендеринг -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

  <!-- Babel — компилирует JSX-синтаксис прямо в браузере -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>

  <!-- Корневой элемент: React монтирует приложение сюда -->
  <div id="root"></div>

  <!--
    Порядок загрузки скриптов важен!
    config.js и utils.js загружаются первыми, чтобы их функции
    (fetchCoins, fmtPrice и др.) были доступны в React-коде ниже.
  -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>

  <!--
    React-компоненты.
    type="text/babel" — Babel перехватывает этот тег и компилирует JSX.
    Все функции из config.js и utils.js доступны здесь как глобальные переменные.
  -->
  <script type="text/babel">

    // Деструктурируем хуки React из глобального объекта
    // (стандарт при подключении React через CDN, а не через npm)
    const { useState, useEffect, useCallback, useMemo, useRef } = React;


    /* ============================================================
       КОМПОНЕНТ: LineChart — SVG-график цены
       ============================================================
       Рисует линейный график без сторонних библиотек.

       Алгоритм:
         1. Находим min/max из массива цен → определяем диапазон
         2. xAt(i) и yAt(v) переводят данные в SVG-координаты
         3. Строим <path> для линии и заливки под ней
         4. Добавляем подписи по осям X и Y
    ============================================================ */
    function LineChart({ prices, currency }) {
      if (!prices || prices.length < 2) {
        return (
          <div className="state-box">
            <span className="empty-icon">📊</span>
            <p>Нет данных для отображения</p>
          </div>
        );
      }

      // Размеры холста и внутренние отступы для подписей
      const W   = 820, H = 230;
      const PAD = { top: 16, right: 24, bottom: 34, left: 82 };
      const iW  = W - PAD.left - PAD.right;
      const iH  = H - PAD.top  - PAD.bottom;

      const vals  = prices.map(p => p[1]);  // только цены
      const times = prices.map(p => p[0]);  // только временные метки

      const minV  = Math.min(...vals);
      const maxV  = Math.max(...vals);
      const range = maxV - minV || 1;       // защита от деления на ноль

      // Цвет: зелёный если цена выросла, красный если упала
      const isUp  = vals[vals.length - 1] >= vals[0];
      const color = isUp ? '#10B981' : '#EF4444';

      // Масштабирование: индекс/цена → координата SVG
      const xAt = i => PAD.left + (i / (prices.length - 1)) * iW;
      const yAt = v => PAD.top  + (1 - (v - minV) / range)  * iH;

      // SVG-путь линии: M x0 y0  L x1 y1  L x2 y2 ...
      const linePath = prices
        .map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(p[1]).toFixed(1)}`)
        .join(' ');

      // Путь заливки: продолжаем вниз и замыкаем
      const areaPath =
        linePath +
        ` L ${xAt(prices.length - 1).toFixed(1)} ${(PAD.top + iH).toFixed(1)}` +
        ` L ${xAt(0).toFixed(1)} ${(PAD.top + iH).toFixed(1)} Z`;

      // 5 меток по оси Y (горизонтальные линии сетки)
      const yLabels = [0, 0.25, 0.5, 0.75, 1].map(t => ({
        price: minV + t * range,
        y: PAD.top + (1 - t) * iH,
      }));

      // 5 меток по оси X (даты)
      const xLabels = [0, 0.25, 0.5, 0.75, 1].map(t => {
        const idx = Math.round(t * (prices.length - 1));
        return { x: xAt(idx), label: fmtDate(times[idx]) };
      });

      const lastX = xAt(prices.length - 1);
      const lastY = yAt(vals[vals.length - 1]);

      return (
        <div className="chart-svg-wrap">
          <svg viewBox={`0 0 ${W} ${H}`}
            style={{ width: '100%', height: 'auto', display: 'block' }}
            xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stopColor={color} stopOpacity="0.18" />
                <stop offset="100%" stopColor={color} stopOpacity="0.01" />
              </linearGradient>
            </defs>

            {/* Линии сетки + подписи цен (ось Y) */}
            {yLabels.map((l, i) => (
              <g key={i}>
                <line x1={PAD.left} y1={l.y} x2={PAD.left + iW} y2={l.y}
                  stroke="#E2E8F0" strokeDasharray="4 4" />
                <text x={PAD.left - 8} y={l.y + 4}
                  textAnchor="end" fontSize="11" fill="#94A3B8">
                  {fmtPrice(l.price, currency)}
                </text>
              </g>
            ))}

            {/* Подписи дат (ось X) */}
            {xLabels.map((l, i) => (
              <text key={i} x={l.x} y={H - 6}
                textAnchor="middle" fontSize="11" fill="#94A3B8">
                {l.label}
              </text>
            ))}

            <path d={areaPath} fill="url(#areaGradient)" />
            <path d={linePath} fill="none" stroke={color}
              strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
            <circle cx={lastX} cy={lastY} r="5" fill={color} />
            <circle cx={lastX} cy={lastY} r="9" fill={color} fillOpacity="0.18" />
          </svg>
        </div>
      );
    }


    /* ============================================================
       КОМПОНЕНТ: TableHeader — заголовок таблицы с сортировкой
       ============================================================
       При клике на колонку:
         • первый клик → убывание (desc, самые большие сверху)
         • повторный   → возрастание (asc)
    ============================================================ */
    function TableHeader({ sortKey, sortDir, onSort }) {
      // Иконка рядом с названием колонки
      function SortIcon({ colKey }) {
        const active = sortKey === colKey;
        return (
          <span className={`sort-icon${active ? ' on' : ''}`}>
            {active ? (sortDir === 'desc' ? '↓' : '↑') : '↕'}
          </span>
        );
      }

      return (
        <div className="table-header">
          <span>#</span>
          <span>Монета</span>
          <span className={`col-sortable${sortKey === 'current_price' ? ' sorted' : ''}`}
            onClick={() => onSort('current_price')}>
            Цена <SortIcon colKey="current_price" />
          </span>
          <span className={`col-sortable${sortKey === 'price_change_percentage_24h' ? ' sorted' : ''}`}
            onClick={() => onSort('price_change_percentage_24h')}>
            24 ч <SortIcon colKey="price_change_percentage_24h" />
          </span>
          <span className={`col-sortable${sortKey === 'market_cap' ? ' sorted' : ''}`}
            onClick={() => onSort('market_cap')}>
            Кап. <SortIcon colKey="market_cap" />
          </span>
          <span></span>
        </div>
      );
    }


    /* ============================================================
       КОМПОНЕНТ: CoinRow — строка одной монеты
    ============================================================ */
    function CoinRow({ coin, rank, selected, favorite, currency, onSelect, onFavorite }) {
      const pct = coin.price_change_percentage_24h;
      const pos = pct != null && pct >= 0;

      return (
        <div className={`coin-row${selected ? ' is-selected' : ''}`}
          onClick={() => onSelect(coin)}>

          <span className="coin-rank">{rank}</span>

          <div className="coin-info">
            {/* Звезда: добавить / убрать из избранного */}
            <button
              className={`star-btn${favorite ? ' is-fav' : ''}`}
              title={favorite ? 'Убрать из избранного' : 'В избранное'}
              onClick={e => { e.stopPropagation(); onFavorite(coin.id); }}>
              {favorite ? '★' : '☆'}
            </button>
            <img src={coin.image} alt={coin.name} className="coin-logo" loading="lazy" />
            <div>
              <div className="coin-name">{coin.name}</div>
              <div className="coin-sym">{coin.symbol}</div>
            </div>
          </div>

          {/* Цена в выбранной валюте */}
          <span className="col-right">{fmtPrice(coin.current_price, currency)}</span>

          {/* Изменение за 24 часа */}
          <span className={`change ${pos ? 'pos' : 'neg'}`}>
            {pos ? '▲' : '▼'} {pct != null ? Math.abs(pct).toFixed(2) + '%' : '—'}
          </span>

          <span className="market-cap">{fmtCap(coin.market_cap, currency)}</span>

          <button className="chart-btn"
            onClick={e => { e.stopPropagation(); onSelect(coin); }}>
            График
          </button>
        </div>
      );
    }


    /* ============================================================
       КОМПОНЕНТ: SearchBar — поле поиска
    ============================================================ */
    function SearchBar({ value, onChange }) {
      return (
        <div className="search-wrap">
          <svg className="search-icon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input className="search-input" type="text"
            placeholder="Поиск по названию или тикеру…"
            value={value} onChange={e => onChange(e.target.value)} />
        </div>
      );
    }


    /* ============================================================
       КОМПОНЕНТ: ChartPanel — панель с графиком монеты
    ============================================================ */
    function ChartPanel({ coin, currency, onClose }) {
      const [days,         setDays]         = useState(7);
      const [chartPrices,  setChartPrices]  = useState(null);
      const [chartLoading, setChartLoading] = useState(false);
      const [chartError,   setChartError]   = useState(null);

      // Ссылка на корневой <div> панели — нужна для автоскролла
      const panelRef = useRef(null);

      // Плавная прокрутка к панели при её открытии.
      //
      // Почему setTimeout, а не scrollIntoView напрямую?
      // При монтировании компонента браузер ещё не завершил layout —
      // элемент есть в DOM, но его координаты ещё пересчитываются
      // (особенно когда список длинный). Задержка 120ms даёт браузеру
      // время отрисовать панель в финальной позиции.
      //
      // Почему window.scrollTo вместо scrollIntoView?
      // Так мы точно контролируем отступ сверху (80px),
      // чтобы панель не упиралась в самый верх экрана.
      useEffect(() => {
        const timer = setTimeout(() => {
          if (panelRef.current) {
            const elementTop = panelRef.current.getBoundingClientRect().top;
            const scrollTop  = window.scrollY + elementTop - 80; // 80px — отступ сверху
            window.scrollTo({ top: scrollTop, behavior: 'smooth' });
          }
        }, 120);

        // Очищаем таймер если компонент размонтировали раньше срока
        return () => clearTimeout(timer);
      }, []); // [] — только при монтировании

      // Загружаем данные при смене монеты, валюты или периода
      useEffect(() => {
        setChartLoading(true);
        setChartError(null);
        setChartPrices(null);
        fetchChart(coin.id, currency, days)
          .then(data  => setChartPrices(data.prices))
          .catch(err  => setChartError(err.message))
          .finally(() => setChartLoading(false));
      }, [coin.id, currency, days]);

      const pct = coin.price_change_percentage_24h;
      const pos = pct != null && pct >= 0;

      return (
        <div className="chart-panel" ref={panelRef}>
          <div className="chart-header">
            <div className="chart-coin-info">
              <img src={coin.image} alt={coin.name} />
              <div>
                <div className="chart-coin-name">{coin.name}</div>
                <div className="chart-coin-price">{fmtPrice(coin.current_price, currency)}</div>
                <span className={`change ${pos ? 'pos' : 'neg'}`} style={{ marginTop: 4 }}>
                  {pos ? '▲' : '▼'} {pct != null ? Math.abs(pct).toFixed(2) + '%' : '—'} за 24ч
                </span>
              </div>
            </div>

            <div className="chart-controls">
              <div className="days-switcher">
                {[7, 30, 90].map(d => (
                  <button key={d}
                    className={`day-btn${days === d ? ' active' : ''}`}
                    onClick={() => setDays(d)}>
                    {d}д
                  </button>
                ))}
              </div>
              <button className="close-btn" onClick={onClose} title="Закрыть">✕</button>
            </div>
          </div>

          {chartLoading && <div className="state-box"><div className="spinner" /></div>}
          {chartError && !chartLoading && (
            <div className="state-box">
              <p className="error-msg">Не удалось загрузить данные</p>
              <p className="hint-msg">{chartError}</p>
            </div>
          )}
          {chartPrices && !chartLoading && (
            <LineChart prices={chartPrices} currency={currency} />
          )}
        </div>
      );
    }


    /* ============================================================
       КОМПОНЕНТ: App — главный компонент
       ============================================================
       Управляет всем глобальным состоянием:
         coins        — список загруженных монет
         currency     — выбранная валюта (usd/eur/rub)
         page         — текущая страница пагинации
         hasMore      — есть ли следующая страница
         tab          — вкладка ('all' | 'favorites')
         search       — строка поиска
         sortKey      — поле сортировки (null = по умолчанию)
         sortDir      — направление ('asc' | 'desc')
         favorites    — Set с ID избранных монет
         selectedCoin — монета, для которой открыт график
    ============================================================ */
    function App() {
      // ── Данные и загрузка ──────────────────────────────────────
      const [coins,       setCoins]       = useState([]);
      const [loading,     setLoading]     = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const [error,       setError]       = useState(null);
      const [hasMore,     setHasMore]     = useState(true);
      const [page,        setPage]        = useState(1);

      // ── Отображение ────────────────────────────────────────────
      const [currency,     setCurrency]     = useState('usd');
      const [tab,          setTab]          = useState('all');
      const [search,       setSearch]       = useState('');
      const [sortKey,      setSortKey]      = useState(null);
      const [sortDir,      setSortDir]      = useState('desc');
      const [selectedCoin, setSelectedCoin] = useState(null);

      // ── Избранное — читаем из localStorage при старте ──────────
      // Функция-инициализатор в useState выполняется один раз.
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem(LS_FAVORITES);
          return saved ? new Set(JSON.parse(saved)) : new Set();
        } catch {
          return new Set();
        }
      });

      // Сохраняем избранное в localStorage при каждом изменении
      useEffect(() => {
        localStorage.setItem(LS_FAVORITES, JSON.stringify([...favorites]));
      }, [favorites]);

      // ── При смене валюты: сброс и загрузка с 1-й страницы ─────
      useEffect(() => {
        setCoins([]);
        setPage(1);
        setHasMore(true);
        setLoading(true);
        setError(null);
        fetchCoins(currency, 1)
          .then(data => { setCoins(data); setHasMore(data.length === PER_PAGE); })
          .catch(err => setError(err.message))
          .finally(() => setLoading(false));
      }, [currency]);

      // ── Пагинация: загрузка следующей страницы ─────────────────
      function handleLoadMore() {
        const next = page + 1;
        setLoadingMore(true);
        fetchCoins(currency, next)
          .then(data => {
            setCoins(prev => [...prev, ...data]); // дописываем к существующим
            setPage(next);
            setHasMore(data.length === PER_PAGE);
          })
          .catch(err => setError(err.message))
          .finally(() => setLoadingMore(false));
      }

      // ── Переключение избранного ────────────────────────────────
      const toggleFavorite = useCallback(id => {
        setFavorites(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      }, []);

      // ── Выбор монеты для графика (повторный клик — закрыть) ────
      const handleSelect = useCallback(coin => {
        setSelectedCoin(prev => prev?.id === coin.id ? null : coin);
      }, []);

      // ── Сортировка ─────────────────────────────────────────────
      function handleSort(key) {
        if (sortKey === key) {
          setSortDir(d => d === 'desc' ? 'asc' : 'desc');
        } else {
          setSortKey(key);
          setSortDir('desc');
        }
      }

      // ── Список монет для отображения ──────────────────────────
      // Порядок: фильтр по вкладке → поиск → сортировка
      const displayed = useMemo(() => {
        let result = tab === 'favorites'
          ? coins.filter(c => favorites.has(c.id))
          : coins;

        const q = search.trim().toLowerCase();
        if (q) {
          result = result.filter(c =>
            c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q)
          );
        }

        if (sortKey) {
          result = [...result].sort((a, b) => {
            const av = a[sortKey] ?? -Infinity;
            const bv = b[sortKey] ?? -Infinity;
            return sortDir === 'desc' ? bv - av : av - bv;
          });
        }

        return result;
      }, [coins, tab, favorites, search, sortKey, sortDir]);

      // ── Рендер ─────────────────────────────────────────────────
      return (
        <div className="app">

          {/* Шапка */}
          <div className="header">
            <div className="header-left">
              <h1>🪙 Crypto Tracker</h1>
              <p>Актуальные курсы · Топ монет по капитализации</p>
            </div>
            <div className="header-right">
              {/* Переключатель валюты */}
              <div className="currency-switcher">
                {Object.entries(CURRENCIES).map(([key, cur]) => (
                  <button key={key}
                    className={`currency-btn${currency === key ? ' active' : ''}`}
                    onClick={() => { setCurrency(key); setSelectedCoin(null); }}
                    title={cur.label}>
                    {cur.flag} {cur.label}
                  </button>
                ))}
              </div>
              <span className="api-badge">CoinGecko API</span>
            </div>
          </div>

          {/* Вкладки */}
          <div className="tabs">
            <button className={`tab-btn${tab === 'all' ? ' active' : ''}`}
              onClick={() => setTab('all')}>
              Все монеты <span className="tab-count">{coins.length}</span>
            </button>
            <button className={`tab-btn${tab === 'favorites' ? ' active' : ''}`}
              onClick={() => setTab('favorites')}>
              ⭐ Избранное <span className="tab-count">{favorites.size}</span>
            </button>
          </div>

          {/* Поиск */}
          <SearchBar value={search} onChange={setSearch} />

          {/* Загрузка */}
          {loading && (
            <div className="state-box card">
              <div className="spinner" /><p>Загружаем данные…</p>
            </div>
          )}

          {/* Ошибка */}
          {error && (
            <div className="state-box card">
              <p className="error-msg">Не удалось загрузить данные</p>
              <p className="hint-msg">{error}</p>
              <p className="hint-msg">
                Возможно, превышен лимит запросов CoinGecko (~10–30 в мин.).
                Подождите и обновите страницу.
              </p>
            </div>
          )}

          {/* Таблица */}
          {!loading && !error && (
            <div className="table-card">
              <TableHeader sortKey={sortKey} sortDir={sortDir} onSort={handleSort} />

              {displayed.length === 0 ? (
                <div className="state-box">
                  <span className="empty-icon">{tab === 'favorites' ? '⭐' : '🔍'}</span>
                  <p>{tab === 'favorites'
                    ? 'Нет избранных монет. Нажмите ☆ рядом с монетой.'
                    : `По запросу «${search}» ничего не найдено.`}
                  </p>
                </div>
              ) : (
                displayed.map(coin => (
                  <CoinRow key={coin.id} coin={coin}
                    rank={coins.indexOf(coin) + 1}
                    selected={selectedCoin?.id === coin.id}
                    favorite={favorites.has(coin.id)}
                    currency={currency}
                    onSelect={handleSelect}
                    onFavorite={toggleFavorite} />
                ))
              )}

              {/* Пагинация */}
              {tab === 'all' && !search && (
                <div className="load-more-wrap">
                  <p className="coins-counter">
                    Загружено: <strong>{coins.length}</strong>
                    {hasMore ? ' · есть ещё' : ' · все монеты загружены'}
                  </p>
                  {hasMore && (
                    <button className="load-more-btn"
                      onClick={handleLoadMore} disabled={loadingMore}>
                      {loadingMore ? 'Загрузка…' : `Загрузить ещё ${PER_PAGE}`}
                    </button>
                  )}
                </div>
              )}
            </div>
          )}

          {/* График */}
          {selectedCoin && (
            <ChartPanel coin={selectedCoin} currency={currency}
              onClose={() => setSelectedCoin(null)} />
          )}

        </div>
      );
    }


    /* ============================================================
       ТОЧКА ВХОДА
       Монтируем React-приложение в <div id="root">
    ============================================================ */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
